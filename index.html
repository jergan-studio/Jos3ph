<!DOCTYPE html>
<html>
<head>
  <title>Lua Learning Studio</title>

  <script src="https://unpkg.com/blockly/blockly.min.js"></script>
  <script src="https://unpkg.com/blockly/lua.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  🧠 Lua Learning Studio

  <input id="user" placeholder="username">
  <input id="pass" placeholder="password" type="password">

  <button onclick="login()">Login</button>
  <button onclick="registerUser()">Register</button>
</header>

<div id="container">

  <div id="blocklyDiv"></div>

  <div id="rightPanel">

    <h3>📜 Lua Code</h3>
    <pre id="codeOutput"></pre>

    <button onclick="run()">Generate Lua</button>
    <button onclick="exportLua()">Export .lua</button>
    <button onclick="save()">Save</button>
    <button onclick="load()">Load</button>

    <div id="console"></div>

  </div>

</div>

<!-- TOOLBOX -->
<xml id="toolbox" style="display:none">

  <category name="Basics" colour="160">
    <block type="text_print"></block>
    <block type="create_sprite"></block>
    <block type="move"></block>
  </category>

</xml>

<script src="script.js"></script>
</body>
</html>
