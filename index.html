<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jos3ph Luau Studio</title>

<script src="https://unpkg.com/blockly/blockly.min.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>🧠 Jos3ph Luau Studio</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="registerUser()">Register</button>
</header>

<div id="container">

  <div id="blocklyDiv"></div>

  <div id="rightPanel">

    <h3>Generated Luau</h3>

    <pre id="codeOutput"></pre>

    <div class="buttons">
      <button onclick="generateCode()">Generate</button>
      <button onclick="exportLuau()">Export .luau</button>
      <button onclick="save()">Save</button>
      <button onclick="load()">Load</button>
    </div>

    <div id="console"></div>

  </div>

</div>

<xml id="toolbox" style="display:none">

  <category name="Output" colour="160">
    <block type="print_text"></block>
  </category>

  <category name="Variables" colour="230">
    <block type="set_var"></block>
  </category>

  <category name="Control" colour="60">
    <block type="repeat_times"></block>
    <block type="wait_seconds"></block>
  </category>

</xml>

<script src="script.js"></script>

</body>
</html>
